<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反客为主 · 自行车骑鹈鹕</title>
<style>
:root{color-scheme:dark;--canvas:#010102;--paper:#f7f8f8;--muted:#8a8f98;--line:#23252a;--accent:#5e6ad2;--surface:#0f1011}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--paper);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1440px;min-height:100svh;margin:auto;padding:32px 48px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:24px;gap:16px}.wordmark{font-size:14px;letter-spacing:.4px;display:flex;align-items:center;gap:12px}.mark{width:20px;height:20px;border:5px solid var(--accent);border-radius:50%}.edition{font-size:12px;color:var(--muted)}.intro{margin-top:48px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}h1{font-family:"SF Pro Display",-apple-system,system-ui,sans-serif;font-size:clamp(40px,6vw,80px);font-weight:600;letter-spacing:-3px;line-height:1.05;margin:0}h1 span{color:var(--muted)}.intro p{font-size:14px;line-height:1.8;color:var(--muted);margin:0}.art{position:relative;flex:1;display:grid;align-items:center;min-height:320px}.scene{display:block;width:100%;max-height:65svh;overflow:visible}footer{border-top:1px solid var(--line);padding-top:24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.caption{font-size:14px;margin:0}.caption small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.control{position:relative;flex-shrink:0}.control input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}.control label{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:14px}.control:hover label{border-color:var(--muted)}.control input:focus-visible+label{outline:2px solid var(--accent);outline-offset:4px}.play{display:none}body:has(#pause:checked) .animated{animation-play-state:paused}#pause:checked+label .play{display:inline}#pause:checked+label .pause{display:none}
.bird{animation:bob .8s ease-in-out infinite;transform-origin:550px 450px}.bicycle{animation:balance 1.6s ease-in-out infinite;transform-origin:510px 320px}.wheel{animation:spin 1.6s linear infinite}.rear-wheel{transform-origin:391px 290px}.front-wheel{transform-origin:631px 290px}.leg{transform-origin:535px 458px;animation:stride .8s ease-in-out infinite}.leg.back{animation-delay:-.4s;transform-origin:585px 451px}.wing{transform-origin:600px 400px;animation:flap .8s ease-in-out infinite}.scarf{transform-origin:577px 181px;animation:stream .8s ease-in-out infinite}.dash{animation:travel 1.6s linear infinite}.dash.second{animation-delay:-.8s}.shadow{transform-origin:540px 575px;animation:shadow .8s ease-in-out infinite}.blink{transform-origin:737px 245px;animation:blink 5s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1deg)}}@keyframes balance{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes stride{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-26deg)}}@keyframes flap{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(9deg)}}@keyframes stream{0%,100%{transform:skewY(-5deg) scaleX(1)}50%{transform:skewY(7deg) scaleX(.92)}}@keyframes travel{from{transform:translateX(200px);opacity:0}20%,80%{opacity:.6}to{transform:translateX(-300px);opacity:0}}@keyframes shadow{50%{transform:scaleX(.88);opacity:.5}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}
@media(max-width:640px){main{padding:24px}.intro{margin-top:32px;display:block}.intro p{margin-top:16px}h1{letter-spacing:-1.8px}.edition{max-width:110px;text-align:right}.art{min-height:360px;margin:0 -20px}.scene{min-height:300px}footer{gap:12px}.caption{font-size:12px}.caption small{max-width:200px}.control label{padding:8px 12px}}
@media(prefers-reduced-motion:reduce){.animated{animation:none!important}.control{display:none}}
</style>
</head>
<body>
<main>
<header><div class="wordmark"><span class="mark" aria-hidden="true"></span>不合常理 / MOTION STUDY</div><span class="edition">纯粹二维 · 无限兜风</span></header>
<section class="intro" aria-labelledby="heading"><h1 id="heading">反客<span>为主。</span></h1><p>今天，换自行车搭个便车。<br>目的地不重要，谁载谁才重要。</p></section>
<div class="art">
<svg class="scene" viewBox="0 0 1120 640" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">一辆自行车骑着鹈鹕奔跑</title>
<desc id="art-desc">黑色舞台上，一只由白色几何图形组成的长嘴鹈鹕交替迈动双腿。背上的自行车像骑手一样摇晃，两个悬空的车轮不断旋转，车把上的小围巾随风摆动。</desc>
<defs>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><path d="M0 0V9" stroke="#8a8f98" stroke-width="2"/></pattern>
<g id="wheel-lines" fill="none" stroke="#8a8f98" stroke-width="1.5"><circle r="70"/><circle r="59" stroke="#34343a"/><path d="M-66 0H66M0-66V66M-47-47 47 47M47-47-47 47"/><circle r="7" fill="#f7f8f8" stroke="none"/><path d="M-35-60A70 70 0 0 1 60-35" stroke="#f7f8f8" stroke-width="5"/></g>
</defs>
<!-- A quiet orbital backdrop, not a second subject. -->
<circle cx="564" cy="313" r="246" fill="none" stroke="#18191a"/>
<path d="M564 55V70M564 556V571M306 313H321M807 313H822" stroke="#34343a"/>
<path d="M128 576H991" stroke="#23252a"/>
<ellipse class="shadow animated" cx="550" cy="575" rx="172" ry="10" fill="#18191a"/>
<g fill="none" stroke="#62666d" stroke-width="2" stroke-linecap="round">
<path class="dash animated" d="M234 455h64m-24 16h34M785 535h45"/>
<path class="dash second animated" d="M230 530h42M750 420h76m-35 15h25"/>
</g>
<g class="bird animated">
<!-- The alternating feet live behind the bird's body. -->
<g class="leg back animated" fill="none" stroke="#8a8f98" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M585 451 573 504 606 545"/><path d="m606 545 29 11-46 3Z" fill="#8a8f98" stroke-width="5"/></g>
<g class="leg animated" fill="none" stroke="#d0d6e0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="m535 458-17 55 25 42"/><path d="m543 553 32 12-51 1Z" fill="#d0d6e0" stroke-width="5"/></g>
<!-- Tail, enormous oval body, and the unmistakable hooked pelican neck. -->
<path d="m391 370-100-43 42 80 104 26Z" fill="#d0d6e0"/>
<path d="m350 373-55-11 53 35" fill="#f7f8f8"/>
<path d="M351 365C421 337 538 344 620 365L666 263C679 220 712 204 744 218C776 232 774 270 749 298L717 340C694 378 702 415 656 452C608 493 474 490 399 450C368 433 350 404 351 365Z" fill="#f7f8f8"/>
<path d="M685 275c-12 61-49 84-40 140 6 21 14 25 14 25-4-55 25-77 49-109 17-24 27-44 27-44Z" fill="#d0d6e0"/>
<!-- Long bill and hanging throat pouch, rendered as two cut-paper wedges. -->
<path d="M748 257 947 279 754 293Z" fill="#d0d6e0"/>
<path d="M755 284 929 282C867 329 798 361 756 310Z" fill="#8a8f98"/>
<path d="M764 292 908 286C859 316 807 336 775 312Z" fill="url(#hatch)"/>
<path d="m748 257 199 22-11 9" fill="none" stroke="#f7f8f8" stroke-width="5" stroke-linejoin="round"/>
<circle cx="737" cy="245" r="12" fill="#d0d6e0"/>
<g class="blink animated"><circle cx="739" cy="244" r="5" fill="#010102"/><circle cx="740" cy="242" r="1.5" fill="#f7f8f8"/></g>
<path d="m715 220-11-16 25 10" fill="#f7f8f8"/>
<g class="wing animated"><path d="M591 389C530 367 452 382 389 397C432 460 536 467 596 408Z" fill="#d0d6e0"/><path d="M414 403C466 420 521 425 566 404M435 420c44 17 82 17 110 5" fill="none" stroke="#8a8f98" stroke-width="2" stroke-linecap="round"/></g>
<!-- The bicycle is the passenger: both wheels rest above the back, not below it. -->
<g class="bicycle animated">
<path d="M384 361q38-8 65 1M589 361q35-7 70 3" fill="none" stroke="#62666d" stroke-width="3" stroke-linecap="round"/>
<g class="wheel rear-wheel animated"><use href="#wheel-lines" x="391" y="290"/></g>
<g class="wheel front-wheel animated"><use href="#wheel-lines" x="631" y="290"/></g>
<g fill="none" stroke="#f7f8f8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="m391 290 66-106 51 106H391l185-88 55 88M508 290l68-88-12-33h33q19 0 19 17t-18 16M457 184l-10-27"/></g>
<path d="M422 153h55q9 0 9 7t-9 7h-48q-11 0-7-14Z" fill="#d0d6e0"/>
<circle cx="508" cy="290" r="17" fill="#010102" stroke="#d0d6e0" stroke-width="3"/>
<g transform="translate(508 290)"><g class="animated" style="animation:spin 1.6s linear infinite"><path d="M-23-19 23 19" stroke="#8a8f98" stroke-width="5"/><path d="M-36-19h23M12 19h23" stroke="#f7f8f8" stroke-width="5" stroke-linecap="round"/></g></g>
<path class="scarf animated" d="M577 181C548 168 539 196 513 180S478 174 462 166L471 184 457 192C486 185 489 208 515 201S553 184 577 188Z" fill="#7a7fad"/>
<path d="m565 173 12 16" stroke="#d0d6e0" stroke-width="5" stroke-linecap="round"/>
</g>
</g>
<g fill="#62666d" font-size="11" font-family="-apple-system,system-ui,sans-serif" letter-spacing="2"><text x="129" y="609">地面 / GROUND</text><text x="991" y="609" text-anchor="end">方向 →</text></g>
</svg>
</div>
<footer><p class="caption">自行车骑着鹈鹕。不是反过来。<small>两个轮子负责享受风，两只脚负责向前。</small></p><div class="control"><input id="pause" type="checkbox" aria-label="暂停动画"><label for="pause"><span class="pause">Ⅱ &nbsp; 暂停动画</span><span class="play">▷ &nbsp; 继续播放</span></label></div></footer>
</main>
</body>
</html>
