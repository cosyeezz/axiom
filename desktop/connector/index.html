<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom 连接</title>
<style>
  /* Pake 壳内置连接入口页：不依赖后端静态服务，地址可配置（本地或远程）。
     样式遵循 design skill 的 linear 风格 token：近黑底 #010102、薰衣草蓝紫 #5e6ad2。 */
  :root {
    --bg: #010102;
    --surface: #0d0d0e;
    --raised: #111113;
    --line: rgba(255, 255, 255, 0.07);
    --ink: #f7f8f8;
    --muted: #8a8f98;
    --accent: #5e6ad2;
    --accent-hover: #6a75e8;
    --on-accent: #ffffff;
    --success: #70c99e;
    --danger: #f67043;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 Inter, ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: min(400px, calc(100vw - 48px));
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand svg { flex: none; }
  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
  .lede { color: var(--muted); margin-bottom: 22px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input#address {
    flex: 1; min-width: 0;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font: inherit;
    padding: 9px 12px;
    outline: none;
  }
  input#address:focus { border-color: var(--accent); }
  input#address::placeholder { color: #5c6066; }
  button#connect {
    background: var(--accent);
    color: var(--on-accent);
    border: none; border-radius: 8px;
    font: inherit; font-weight: 600;
    padding: 9px 18px;
    cursor: pointer;
  }
  button#connect:hover { background: var(--accent-hover); }
  button#connect:disabled { opacity: 0.55; cursor: default; }
  .status {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    min-height: 20px;
    word-break: break-all;
  }
  .status[data-kind="ok"] { color: var(--success); }
  .status[data-kind="error"] { color: var(--danger); }
  .hint {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .hint code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    background: var(--raised);
    border-radius: 4px;
    padding: 1px 5px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="6" fill="none" stroke="#5e6ad2" stroke-width="1.5"/>
        <path d="M7 15 L11 7 L15 15" fill="none" stroke="#f7f8f8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Axiom</h1>
    </div>
    <p class="lede">连接到你的 Axiom 服务：本机或远程地址均可。</p>
    <label for="address">服务地址</label>
    <div class="row">
      <input id="address" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="127.0.0.1:4319 或 example.com:8080" autofocus>
      <button id="connect" type="button">连接</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="hint">
      本机默认 <code>127.0.0.1:4319</code>；连接远程需在该机器上以
      <code>AXIOM_HOST=0.0.0.0</code>（或内网 IP）启动服务并放行端口。
    </p>
  </main>
<script>
(() => {
  const KEY = "axiom.connector.address";
  const DEFAULT = "127.0.0.1:4319";
  const input = document.getElementById("address");
  const button = document.getElementById("connect");
  const status = document.getElementById("status");
  let busy = false;

  const say = (text, kind = "") => { status.textContent = text; status.dataset.kind = kind; };

  // 解析输入为 http(s) origin：支持 host[:port]（默认端口 4319）与完整 URL；
  // 拒绝非 http(s) scheme、携带 userinfo、空主机与非法端口，防 javascript: 等注入。
  function normalize(raw) {
    const text = String(raw || "").trim();
    if (!text) return null;
    let url;
    try { url = new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(text) ? text : `http://${text}`); }
    catch { return null; }
    if ((url.protocol !== "http:" && url.protocol !== "https:")
      || !url.hostname || url.username || url.password) return null;
    const port = url.port ? Number(url.port) : 4319;
    if (!Number.isInteger(port) || port < 1 || port > 65535) return null;
    // url.host 已含 IPv6 方括号与显式端口；无端口时补默认 4319。
    const hostPart = url.port ? url.host : `${url.host}:${port}`;
    return `${url.protocol}//${hostPart}`;
  }

  // no-cors 探测：只要网络层可达且服务返回任意 HTTP 响应即视为在线（opaque 响应不可读属预期）。
  function probe(origin, timeout = 4000) {
    return fetch(origin, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(timeout) });
  }

  async function connect() {
    if (busy) return;
    const origin = normalize(input.value);
    if (!origin) { say("地址无效：请输入 host:port 或 http(s)://host:port", "error"); return; }
    busy = true;
    button.disabled = true;
    say(`正在连接 ${origin} …`);
    try {
      await probe(origin);
      try { localStorage.setItem(KEY, origin); } catch {}
      say(`已连接 ${origin}，正在打开…`, "ok");
      location.href = origin;
    } catch {
      busy = false;
      button.disabled = false;
      say(`无法连接 ${origin}：请确认服务已启动、地址与端口正确（远程需 AXIOM_HOST 与防火墙放行）`, "error");
      input.focus();
      input.select();
    }
  }

  button.onclick = () => void connect();
  input.addEventListener("keydown", (event) => { if (event.key === "Enter") void connect(); });

  // 打开即用：静默探测上次成功地址，可达直接进入应用；不可达停留本页等待输入。
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  input.value = saved || DEFAULT;
  if (saved && saved !== DEFAULT) {
    probe(saved, 3000)
      .then(() => { location.href = saved; })
      .catch(() => { say(`上次地址 ${saved} 未响应，请确认或修改后连接。`, "error"); });
  }
})();
</script>
</body>
</html>
