plugins { id 'com.android.application' }

android {
    namespace 'com.axiom.android'
    compileSdk 35
    buildToolsVersion '34.0.0'
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.axiom.android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    // gomobile libraries are extracted so Android 15 can use 16 KiB-page
    // compatibility mode until all native dependencies support it natively.
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true }
}
dependencies {
    implementation files('libs/bridge.aar')
    // AndroidX is test-only; the shipped UI remains a platform Activity.
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
