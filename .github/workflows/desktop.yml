name: Build Axiom Desktop Test Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Axiom-Windows-x64-unsigned
          - os: macos-15
            artifact: Axiom-macOS-arm64-unsigned
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:stage
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify bundled Windows startup
        if: runner.os == 'Windows'
        run: |
          node scripts/smoke-desktop.mjs
          node scripts/smoke-shell.mjs dist/win-unpacked/Axiom.exe
      - name: Verify bundled macOS backend and disk image
        if: runner.os == 'macOS'
        run: |
          node scripts/smoke-desktop.mjs dist/mac-arm64/Axiom.app/Contents/Resources
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
