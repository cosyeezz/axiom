name: Build Axiom Desktop

on:
  workflow_dispatch:
  push:
    branches: [feat/pake-desktop]
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x64
            artifact: Axiom-Windows-x64
            output: Axiom.msi
          - os: macos-latest
            target: universal
            artifact: Axiom-macOS-universal
            output: Axiom.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS cross-compilation targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Pake (independent of Axiom dependencies)
        run: npm install --global pake-cli@3.16.2
      - name: Build desktop shell
        run: pake --config desktop/pake.json --targets ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30
