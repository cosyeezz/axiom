plugins { id 'com.android.application' }

android {
    namespace 'com.axiom.android'
    compileSdk 35
    buildToolsVersion '34.0.0'
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.axiom.android'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    // gomobile libraries are extracted so Android 15 can use 16 KiB-page
    // compatibility mode until all native dependencies support it natively.
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true }
}
// Export actual selected runtime artifacts, excluding local Go bridge/test tooling.
// POM inheritance and embedded LICENSE/NOTICE are resolved by runtime-notices.py.
tasks.register('collectReleaseNoticeInputs') {
    doLast {
        def artifacts = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { it.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            .collect { a -> [group: a.moduleVersion.id.group, artifact: a.moduleVersion.id.name,
                version: a.moduleVersion.id.version, path: a.file.absolutePath] }
            .sort { a, b -> "${a.group}:${a.artifact}" <=> "${b.group}:${b.artifact}" }
        def output = layout.buildDirectory.file('notices/runtime-inputs.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(artifacts))
    }
}

// Always regenerate before merging assets: a local assemble cannot package stale
// Go-only notices after a dependency change. One task serializes both producers.
def generateNotices = tasks.register('generateThirdPartyNotices') {
    dependsOn 'collectReleaseNoticeInputs'
    doLast {
        exec { workingDir rootProject.projectDir; commandLine 'node', 'scripts/notices.mjs' }
        exec { workingDir rootProject.projectDir; commandLine 'python3', 'scripts/runtime-notices.py' }
    }
}
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('Assets')) dependsOn generateNotices
}

dependencies {
    implementation files('libs/bridge.aar')
    // Platform Activity with compatibility insets; no AppCompat UI.
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
