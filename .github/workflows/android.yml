name: Build Axiom Android
on:
  workflow_dispatch:
  push:
    branches: [master, feat/android-tsnet]
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/go/go.mod
          cache-dependency-path: android/go/go.sum
      - uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: ''
      - name: Install pinned SDK and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve and test network bridge
        working-directory: android/go
        run: |
          go mod tidy
          go mod download all
          gofmt -w .
          go test -race -timeout 180s ./...
      - name: Build Android network AAR
        run: bash android/scripts/build-bridge.sh
      - name: Collect third-party notices
        run: |
          (cd android/go && go mod download all)
          node android/scripts/notices.mjs
      - name: Restore release signing identity
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/axiom-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/axiom-release.p12" >> "$GITHUB_ENV"
      - name: Build, lint and verify APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lint
          mkdir -p dist
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            gradle -p android --no-daemon :app:assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk dist/Axiom-Android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/Axiom-Android-debug.apk
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/*.apk | tee dist/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/*.apk > dist/APK-INFO.txt
          cp android/app/src/main/assets/THIRD-PARTY-NOTICES.txt dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator launch and native bridge smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle -p android --no-daemon :app:connectedDebugAndroidTest
      - name: Save APK and dependency lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Android
          path: |
            dist/
            android/go/go.mod
            android/go/go.sum
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/axiom-release.p12"
  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Axiom-Android
          path: artifact
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s artifact/dist/Axiom-Android.apk
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "Axiom Android ${GITHUB_REF_NAME#android-} (Preview)" \
            --notes-file android/RELEASE-NOTES.md \
            artifact/dist/Axiom-Android.apk artifact/dist/SHA256SUMS.txt \
            artifact/dist/SIGNATURE.txt artifact/dist/APK-INFO.txt \
            artifact/dist/THIRD-PARTY-NOTICES.txt
